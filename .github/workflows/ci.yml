name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run build

  control-api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: control-api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install --upgrade pip
      - run: pip install -e '.[dev]'
      - run: pytest -q

  agent:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: agent
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.x"
      - name: Check Go formatting
        run: |
          gofmt -w cmd/reactoracle-agent/main.go cmd/reactoracle-agent/main_test.go
          git diff --exit-code -- cmd/reactoracle-agent/main.go cmd/reactoracle-agent/main_test.go
      - run: go vet ./...
      - run: go test ./...
      - name: Build ARM64 bundle
        run: |
          bundle=/tmp/reactoracle-agent-linux-arm64
          mkdir -p "$bundle"
          GOOS=linux GOARCH=arm64 go build -o "$bundle/reactoracle-agent" ./cmd/reactoracle-agent
          cp reactoracle-agent.service agent.env.example install.sh configure-kube-access.sh "$bundle/"
          cp ../kubernetes/system/reactoracle-agent-rbac.yaml "$bundle/"
          cp ../kubernetes/system/reactoracle-agent-restart-rbac.yaml "$bundle/"
          (cd "$bundle" && sha256sum reactoracle-agent > SHA256SUMS)
      - uses: actions/upload-artifact@v4
        with:
          name: reactoracle-agent-linux-arm64
          path: /tmp/reactoracle-agent-linux-arm64
          if-no-files-found: error

  monitoring-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install pyyaml
      - name: Validate monitoring YAML
        run: |
          python - <<'PY'
          from pathlib import Path
          import yaml
          root = Path("kubernetes/monitoring")
          for path in sorted(root.glob("*.yaml")):
              with path.open("r", encoding="utf-8") as handle:
                  list(yaml.safe_load_all(handle))
              print("validated", path)
          PY
      - name: Validate monitoring installer shell syntax
        run: bash -n kubernetes/monitoring/install.sh
