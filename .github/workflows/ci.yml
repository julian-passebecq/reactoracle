name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run build

  control-api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: control-api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install --upgrade pip
      - run: pip install -e '.[dev]'
      - run: pytest -q

  agent:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: agent
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.x"
      - run: gofmt -w cmd/reactoracle-agent/main.go
      - run: git diff --exit-code
      - run: go vet ./...
      - run: go test ./...
      - run: GOOS=linux GOARCH=arm64 go build -o /tmp/reactoracle-agent ./cmd/reactoracle-agent
