[project]
name = "reactoracle-control-api"
version = "0.1.0"
description = "Read-only control plane API for ReactOracle"
requires-python = ">=3.12"
dependencies = [
  "fastapi[standard]>=0.116,<1",
  "pydantic>=2.11,<3"
]

[project.optional-dependencies]
dev = [
  "httpx>=0.28,<1",
  "pytest>=8.4,<9"
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
