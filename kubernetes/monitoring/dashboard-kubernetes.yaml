apiVersion: v1
kind: ConfigMap
metadata:
  name: reactoracle-dashboard-kubernetes
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
data:
  kubernetes.json: |-
    {
      "uid": "reactoracle-k8s",
      "title": "ReactOracle · Kubernetes",
      "tags": [
        "reactoracle",
        "kubernetes",
        "k3s"
      ],
      "timezone": "browser",
      "schemaVersion": 39,
      "version": 1,
      "refresh": "30s",
      "time": {
        "from": "now-6h",
        "to": "now"
      },
      "panels": [
        {
          "id": 1,
          "type": "stat",
          "title": "Ready nodes",
          "gridPos": {
            "x": 0,
            "y": 0,
            "w": 6,
            "h": 5
          },
          "targets": [
            {
              "refId": "A",
              "expr": "sum(kube_node_status_condition{condition=\"Ready\",status=\"true\"})"
            }
          ]
        },
        {
          "id": 2,
          "type": "stat",
          "title": "Running pods",
          "gridPos": {
            "x": 6,
            "y": 0,
            "w": 6,
            "h": 5
          },
          "targets": [
            {
              "refId": "A",
              "expr": "sum(kube_pod_status_phase{phase=\"Running\"} == 1)"
            }
          ]
        },
        {
          "id": 3,
          "type": "stat",
          "title": "Pending pods",
          "gridPos": {
            "x": 12,
            "y": 0,
            "w": 6,
            "h": 5
          },
          "targets": [
            {
              "refId": "A",
              "expr": "sum(kube_pod_status_phase{phase=\"Pending\"} == 1)"
            }
          ]
        },
        {
          "id": 4,
          "type": "stat",
          "title": "Failed pods",
          "gridPos": {
            "x": 18,
            "y": 0,
            "w": 6,
            "h": 5
          },
          "targets": [
            {
              "refId": "A",
              "expr": "sum(kube_pod_status_phase{phase=\"Failed\"} == 1)"
            }
          ]
        },
        {
          "id": 5,
          "type": "timeseries",
          "title": "CPU by namespace",
          "gridPos": {
            "x": 0,
            "y": 5,
            "w": 12,
            "h": 8
          },
          "fieldConfig": {
            "defaults": {
              "unit": "cores"
            }
          },
          "targets": [
            {
              "refId": "A",
              "legendFormat": "{{namespace}}",
              "expr": "sum by (namespace) (rate(container_cpu_usage_seconds_total{container!=\"\",image!=\"\"}[5m]))"
            }
          ]
        },
        {
          "id": 6,
          "type": "timeseries",
          "title": "Memory by namespace",
          "gridPos": {
            "x": 12,
            "y": 5,
            "w": 12,
            "h": 8
          },
          "fieldConfig": {
            "defaults": {
              "unit": "bytes"
            }
          },
          "targets": [
            {
              "refId": "A",
              "legendFormat": "{{namespace}}",
              "expr": "sum by (namespace) (container_memory_working_set_bytes{container!=\"\",image!=\"\"})"
            }
          ]
        },
        {
          "id": 7,
          "type": "timeseries",
          "title": "Pod restarts",
          "gridPos": {
            "x": 0,
            "y": 13,
            "w": 12,
            "h": 8
          },
          "targets": [
            {
              "refId": "A",
              "legendFormat": "{{namespace}} / {{pod}}",
              "expr": "increase(kube_pod_container_status_restarts_total[1h])"
            }
          ]
        },
        {
          "id": 8,
          "type": "table",
          "title": "Workload availability",
          "gridPos": {
            "x": 12,
            "y": 13,
            "w": 12,
            "h": 8
          },
          "targets": [
            {
              "refId": "A",
              "format": "table",
              "instant": true,
              "expr": "kube_deployment_status_replicas_available"
            },
            {
              "refId": "B",
              "format": "table",
              "instant": true,
              "expr": "kube_statefulset_status_replicas_ready"
            }
          ]
        }
      ]
    }
