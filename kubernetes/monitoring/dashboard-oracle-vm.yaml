apiVersion: v1
kind: ConfigMap
metadata:
  name: reactoracle-dashboard-oracle-vm
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
data:
  oracle-vm.json: |-
    {
      "uid": "reactoracle-vm",
      "title": "ReactOracle · Oracle VM",
      "tags": [
        "reactoracle",
        "oracle",
        "vm"
      ],
      "timezone": "browser",
      "schemaVersion": 39,
      "version": 1,
      "refresh": "30s",
      "time": {
        "from": "now-6h",
        "to": "now"
      },
      "panels": [
        {
          "id": 1,
          "type": "stat",
          "title": "CPU usage",
          "gridPos": {
            "x": 0,
            "y": 0,
            "w": 6,
            "h": 5
          },
          "fieldConfig": {
            "defaults": {
              "unit": "percent",
              "min": 0,
              "max": 100
            }
          },
          "targets": [
            {
              "refId": "A",
              "expr": "100 - (avg(rate(node_cpu_seconds_total{mode=\"idle\"}[5m])) * 100)"
            }
          ]
        },
        {
          "id": 2,
          "type": "stat",
          "title": "Memory usage",
          "gridPos": {
            "x": 6,
            "y": 0,
            "w": 6,
            "h": 5
          },
          "fieldConfig": {
            "defaults": {
              "unit": "percent",
              "min": 0,
              "max": 100
            }
          },
          "targets": [
            {
              "refId": "A",
              "expr": "100 * (1 - (node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes))"
            }
          ]
        },
        {
          "id": 3,
          "type": "stat",
          "title": "Root disk usage",
          "gridPos": {
            "x": 12,
            "y": 0,
            "w": 6,
            "h": 5
          },
          "fieldConfig": {
            "defaults": {
              "unit": "percent",
              "min": 0,
              "max": 100
            }
          },
          "targets": [
            {
              "refId": "A",
              "expr": "100 * (1 - (node_filesystem_avail_bytes{mountpoint=\"/\",fstype!~\"tmpfs|overlay\"} / node_filesystem_size_bytes{mountpoint=\"/\",fstype!~\"tmpfs|overlay\"}))"
            }
          ]
        },
        {
          "id": 4,
          "type": "stat",
          "title": "Uptime",
          "gridPos": {
            "x": 18,
            "y": 0,
            "w": 6,
            "h": 5
          },
          "fieldConfig": {
            "defaults": {
              "unit": "s"
            }
          },
          "targets": [
            {
              "refId": "A",
              "expr": "time() - node_boot_time_seconds"
            }
          ]
        },
        {
          "id": 5,
          "type": "timeseries",
          "title": "CPU usage over time",
          "gridPos": {
            "x": 0,
            "y": 5,
            "w": 12,
            "h": 8
          },
          "fieldConfig": {
            "defaults": {
              "unit": "percent",
              "min": 0,
              "max": 100
            }
          },
          "targets": [
            {
              "refId": "A",
              "legendFormat": "CPU",
              "expr": "100 - (avg(rate(node_cpu_seconds_total{mode=\"idle\"}[5m])) * 100)"
            }
          ]
        },
        {
          "id": 6,
          "type": "timeseries",
          "title": "Memory usage over time",
          "gridPos": {
            "x": 12,
            "y": 5,
            "w": 12,
            "h": 8
          },
          "fieldConfig": {
            "defaults": {
              "unit": "percent",
              "min": 0,
              "max": 100
            }
          },
          "targets": [
            {
              "refId": "A",
              "legendFormat": "RAM",
              "expr": "100 * (1 - (node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes))"
            }
          ]
        },
        {
          "id": 7,
          "type": "timeseries",
          "title": "Network throughput",
          "gridPos": {
            "x": 0,
            "y": 13,
            "w": 12,
            "h": 8
          },
          "fieldConfig": {
            "defaults": {
              "unit": "Mbits"
            }
          },
          "targets": [
            {
              "refId": "A",
              "legendFormat": "RX {{device}}",
              "expr": "sum by (device) (rate(node_network_receive_bytes_total{device!~\"lo|veth.*|cni.*|flannel.*\"}[5m])) * 8 / 1000000"
            },
            {
              "refId": "B",
              "legendFormat": "TX {{device}}",
              "expr": "sum by (device) (rate(node_network_transmit_bytes_total{device!~\"lo|veth.*|cni.*|flannel.*\"}[5m])) * 8 / 1000000"
            }
          ]
        },
        {
          "id": 8,
          "type": "timeseries",
          "title": "Load average",
          "gridPos": {
            "x": 12,
            "y": 13,
            "w": 12,
            "h": 8
          },
          "targets": [
            {
              "refId": "A",
              "legendFormat": "1m",
              "expr": "node_load1"
            },
            {
              "refId": "B",
              "legendFormat": "5m",
              "expr": "node_load5"
            },
            {
              "refId": "C",
              "legendFormat": "15m",
              "expr": "node_load15"
            }
          ]
        }
      ]
    }
