apiVersion: v1
kind: ConfigMap
metadata:
  name: reactoracle-dashboard-logs
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
data:
  logs.json: |-
    {
      "uid": "reactoracle-logs",
      "title": "ReactOracle · Kubernetes Logs",
      "tags": [
        "reactoracle",
        "logs",
        "loki"
      ],
      "timezone": "browser",
      "schemaVersion": 39,
      "version": 1,
      "refresh": "15s",
      "time": {
        "from": "now-1h",
        "to": "now"
      },
      "templating": {
        "list": [
          {
            "name": "namespace",
            "label": "Namespace",
            "type": "query",
            "datasource": {
              "type": "loki",
              "uid": "loki"
            },
            "query": "label_values(namespace)",
            "refresh": 1,
            "includeAll": true,
            "multi": true
          },
          {
            "name": "app",
            "label": "App",
            "type": "query",
            "datasource": {
              "type": "loki",
              "uid": "loki"
            },
            "query": "label_values({namespace=~\"$namespace\"}, app)",
            "refresh": 1,
            "includeAll": true,
            "multi": true
          }
        ]
      },
      "panels": [
        {
          "id": 1,
          "type": "logs",
          "title": "Pod logs",
          "gridPos": {
            "x": 0,
            "y": 0,
            "w": 24,
            "h": 18
          },
          "datasource": {
            "type": "loki",
            "uid": "loki"
          },
          "targets": [
            {
              "refId": "A",
              "expr": "{namespace=~\"$namespace\", app=~\"$app\"}"
            }
          ]
        }
      ]
    }
