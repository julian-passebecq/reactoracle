apiVersion: v1
kind: Namespace
metadata:
  name: reactoracle-system
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: reactoracle-agent
  namespace: reactoracle-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: reactoracle-agent-readonly
rules:
  - apiGroups: [""]
    resources: ["nodes", "namespaces", "pods"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
  - apiGroups: ["apps"]
    resources: ["deployments", "statefulsets", "daemonsets"]
    verbs: ["get", "list", "watch", "patch"]
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["metrics.k8s.io"]
    resources: ["pods", "nodes"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: reactoracle-agent-readonly
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: reactoracle-agent-readonly
subjects:
  - kind: ServiceAccount
    name: reactoracle-agent
    namespace: reactoracle-system
---
apiVersion: v1
kind: Secret
metadata:
  name: reactoracle-agent-token
  namespace: reactoracle-system
  annotations:
    kubernetes.io/service-account.name: reactoracle-agent
type: kubernetes.io/service-account-token
