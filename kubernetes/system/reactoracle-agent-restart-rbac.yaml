apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: reactoracle-agent-restart
rules:
  - apiGroups: ["apps"]
    resources: ["deployments", "statefulsets", "daemonsets"]
    verbs: ["get", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: reactoracle-agent-restart
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: reactoracle-agent-restart
subjects:
  - kind: ServiceAccount
    name: reactoracle-agent
    namespace: reactoracle-system
